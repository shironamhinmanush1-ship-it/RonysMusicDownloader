plugins { id 'com.android.application' }

android {
    namespace 'com.ronysmusic.downloader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ronysmusic.downloader'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party Android libraries are needed by this app.
dependencies { }
